<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores_Lógicos</title>

    <script>//quando roda, ele diz se esta aprovado ou reprovado//
        var nota = parseFloat(prompt("Digite a nota do aluno:"));
        var faltas = parseInt(prompt("Digite a quantidade de faltas:"));

        var media = 7;
        var faltas_maximas = 2;

        if (nota >= media && faltas <= faltas_maximas) {
            document.write("Aprovado");
        } else {
            document.write("Reprovado");
        }
    </script>
</head>
<body>
    
</body>
</html>
