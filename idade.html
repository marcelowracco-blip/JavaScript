<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        var idade = parseInt (prompt("Digite a idade"))
        if (idade <= 12){
            alert("Criança");
        }
        else if (idade <= 17){
            alert("Jovem");
        }
        else if (idade <= 59){
            alert("Adulto");
        }
        else {
            alert("Idoso");
        }
        
       </script>
</head>
